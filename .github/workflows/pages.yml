name: Deploy website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  TEX_IMAGE: ghcr.io/xu-cheng/texlive-debian@sha256:78ac2204b8df113aca0561e8f173ad5b89ee51e90795173d2fe9bcf0fbce162e

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out website
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build CVs
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$TEX_IMAGE" \
            make -C cv

      - name: Create read-only PDF token
        id: pdf-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PDF_APP_CLIENT_ID }}
          private-key: ${{ secrets.PDF_APP_PRIVATE_KEY }}
          owner: zambonin
          repositories: phd,papers
          permission-contents: read

      - name: Check out private PDFs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: zambonin/phd
          ref: main
          token: ${{ steps.pdf-token.outputs.token }}
          path: _sources/phd
          sparse-checkout: doc
          persist-credentials: false

      - name: Check out papers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: zambonin/papers
          ref: master
          token: ${{ steps.pdf-token.outputs.token }}
          path: _sources/papers
          sparse-checkout: |
            201806-iscc
            201907-africacrypt
            202106-j-crypt-eng
            202409-sbseg
            202503-spw
            202504-aina
            202506-acns
            202604-latin
            202606-iwoca
            202607-icms
            styles
          persist-credentials: false

      - name: Build manuscripts and slides
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$TEX_IMAGE" \
            make -C _sources/papers \
              201806-iscc/main.pdf \
              201907-africacrypt/main.pdf \
              202106-j-crypt-eng/main.pdf \
              202503-spw/main.pdf \
              202504-aina/main.pdf \
              202506-acns/main.pdf \
              202604-latin/main.pdf \
              202606-iwoca/main.pdf \
              202607-icms/main.pdf \
              201806-iscc/slides/main.pdf \
              201907-africacrypt/slides/main.pdf \
              202409-sbseg/slides/main.pdf \
              202503-spw/slides/main.pdf \
              202504-aina/slides/main.pdf \
              202506-acns/slides/main.pdf \
              202604-latin/slides/main.pdf \
              202606-iwoca/slides/main.pdf \
              202607-icms/slides/main.pdf

      - name: Assemble website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/static
          cp index.html CNAME .nojekyll _site/
          cp -a static/. _site/static/

          cp _sources/phd/doc/20260510-cbcrypto/abstract.pdf _site/static/20260510-cbcrypto-abstract.pdf
          cp _sources/phd/doc/20260510-cbcrypto/slides.pdf _site/static/20260510-cbcrypto-slides.pdf
          cp _sources/phd/doc/20240808-iv-wcfa/abstract.pdf _site/static/20240808-iv-wcfa-abstract.pdf
          cp _sources/phd/doc/20240808-iv-wcfa/slides.pdf _site/static/20240808-iv-wcfa-slides.pdf
          cp _sources/phd/doc/20241021-seccom/slides.pdf _site/static/20241021-seccom-slides.pdf
          cp _sources/phd/doc/20210606-ocw/abstract.pdf _site/static/20210606-ocw-abstract.pdf
          cp _sources/phd/doc/20210606-ocw/slides.pdf _site/static/20210606-ocw-slides.pdf
          cp _sources/phd/doc/20230713-labsec-day/slides.pdf _site/static/20230713-labsec-day-slides.pdf

          cp _sources/papers/201806-iscc/main.pdf _site/static/201806-iscc-preprint.pdf
          cp _sources/papers/201907-africacrypt/main.pdf _site/static/201907-africacrypt-preprint.pdf
          cp _sources/papers/202106-j-crypt-eng/main.pdf _site/static/202106-j-crypt-eng-preprint.pdf
          cp _sources/papers/202503-spw/main.pdf _site/static/202503-spw-preprint.pdf
          cp _sources/papers/202504-aina/main.pdf _site/static/202504-aina-preprint.pdf
          cp _sources/papers/202506-acns/main.pdf _site/static/202506-acns-preprint.pdf
          cp _sources/papers/202604-latin/main.pdf _site/static/202604-latin-preprint.pdf
          cp _sources/papers/202606-iwoca/main.pdf _site/static/202606-iwoca-preprint.pdf
          cp _sources/papers/202607-icms/main.pdf _site/static/202607-icms-preprint.pdf
          cp _sources/papers/201806-iscc/slides/main.pdf _site/static/201806-iscc-slides.pdf
          cp _sources/papers/201907-africacrypt/slides/main.pdf _site/static/201907-africacrypt-slides.pdf
          cp _sources/papers/202409-sbseg/slides/main.pdf _site/static/202409-sbseg-slides.pdf
          cp _sources/papers/202503-spw/slides/main.pdf _site/static/202503-spw-slides.pdf
          cp _sources/papers/202504-aina/slides/main.pdf _site/static/202504-aina-slides.pdf
          cp _sources/papers/202506-acns/slides/main.pdf _site/static/202506-acns-slides.pdf
          cp _sources/papers/202604-latin/slides/main.pdf _site/static/202604-latin-slides.pdf
          cp _sources/papers/202606-iwoca/slides/main.pdf _site/static/202606-iwoca-slides.pdf
          cp _sources/papers/202607-icms/slides/main.pdf _site/static/202607-icms-slides.pdf

      - name: Upload website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
